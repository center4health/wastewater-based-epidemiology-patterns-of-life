[build]
  # Base is site/ so Netlify's dependency detection does not find the repo-root
  # Pipfile and try to provision a pinned Python for a build that is a file copy.
  base = "site"
  publish = "."
  # The gallery reads the committed run output directly; stage it into the
  # publish directory so results/ stays the single source of truth.
  command = "rm -rf results && mkdir -p results && cp -R ../results/. results/"

[[headers]]
  for = "/results/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
